<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGTH - Recepción de Emergencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4 text-center">Sistema de Gestión de Triaje Hospitalario (SGTH)</h2>

        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tablero-tab" data-bs-toggle="tab" data-bs-target="#tablero" type="button" role="tab" onclick="cargarPacientes()">Ver Pacientes</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="registro-tab" data-bs-toggle="tab" data-bs-target="#registro" type="button" role="tab">Nuevo Registro</button>
            </li>
        </ul>

        <div class="tab-content bg-white p-4 border border-top-0 rounded-bottom" id="myTabContent">

            <div class="tab-pane fade show active" id="tablero" role="tabpanel">
                <h4 class="mb-3">Pacientes en Espera</h4>
                <div class="table-responsive">
                    <table class="table table-hover table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th>ID Paciente</th>
                                <th>Nombre Completo</th>
                                <th>Gravedad (1-5)</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPacientesBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="tab-pane fade" id="registro" role="tabpanel">
                <h4 class="mb-3">Registrar Nuevo Paciente</h4>
                <div id="alertaFormulario"></div> <form id="formRegistro">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="sintomas" class="form-label">Síntomas</label>
                        <textarea class="form-control" id="sintomas" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="gravedad" class="form-label">Gravedad (1-5)</label>
                        <input type="number" class="form-control" id="gravedad" min="1" max="5" required>
                    </div>
                    <div class="mb-3">
                        <label for="carnetMedico" class="form-label">Carnet del Médico</label>
                        <input type="text" class="form-control" id="carnetMedico" placeholder="Ej. MED-1010" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Registrar Paciente</button>
                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
